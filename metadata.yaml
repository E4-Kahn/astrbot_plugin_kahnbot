name: astrbot_plugin_kahnbot
display_name: KahnBot
short_desc: 会记事、有脾气、会主动说话的群友（开发中，M4 检索注入）
desc: |
  KahnBot —— 一个会记事、有脾气的群友。

  当前进度 M4：她在 M3 的情绪之上开始"记得住"——主人说过的事可以检索到，
  回复前会把最相关的几条贴进请求里（向量 + 字面混合排序，私聊的事不会出现在群聊里）。
  群聊/私聊消息进本地 SQLite（带说话人归属），#sl 之类固定文本被丢弃；
  群里只有 @ 她、拍一拍她、叫到名字才进模型，私聊必回，连续短消息并成一次回复；
  她还有九维情绪、五档心情，靠心跳自己漂移。
  「记住…」自动写入、定时汇总、主动说话在后续里程碑。
version: 0.1.0
author: E4-Kahn
repo: https://github.com/E4-Kahn/astrbot_plugin_kahnbot
astrbot_version: ">=4.29.4"
tags:
  - kahnbot
