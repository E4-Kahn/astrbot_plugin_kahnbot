name: astrbot_plugin_kahnbot
display_name: KahnBot
short_desc: 会记事、有脾气、会主动说话的群友
desc: |
  KahnBot —— 一个会记事、有脾气、会主动说话的群友。

  她真的记事：私聊里或群里被叫到后说「记住…」会写进长期记忆，重要度由模型打分，
  30 天没被提起且分数低的会归档；群里听来的事只进见闻层（注入时标"未必属实"、永不提醒）；
  每 6 小时自己汇总一次流水；带时间的承诺到点会主动说一句，重启后仍然有效。
  她有脾气：生气到一定程度会躲起来不说话，被哄、被连着拍或主人一直找她才会出来，
  躲起来期间被吞下的话，下次开口时其实都记得；沉默够久、情绪上来时也会自己找话说
  （冷却 6 小时、日限 2 条、23:00–08:00 免打扰）。
  每轮回复都会带上当前心情和最近几句群聊；到点提醒也算她主动说的：占一次额度、
  进流水、回写会话历史，不会"说完就忘"。
  群聊/私聊消息进本地 SQLite（带说话人归属），#sl 之类固定文本被丢弃；
  群里只有 @ 她、拍一拍她、叫到名字才进模型，私聊必回，连续短消息并成一次回复；
  她还有九维情绪、五档心情，靠心跳自己漂移。
version: 0.3.0
author: E4-Kahn
repo: https://github.com/E4-Kahn/astrbot_plugin_kahnbot
astrbot_version: ">=4.29.4"
